<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Gestión de Reclamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🛡️ Corredora de Seguros</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-white">
                    <h4 class="mb-0 text-primary">Procesar Nuevo Reclamo (OCR)</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted">Sube el formulario de siniestro en formato PDF. El sistema extraerá los datos automáticamente y los registrará en la base de datos.</p>
                    
                    <form id="uploadForm">
                        <div class="mb-3">
                            <input class="form-control" type="file" id="pdfFile" accept="application/pdf" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="btnSubmit">
                            <span id="btnText">Procesar Documento</span>
                            <span class="spinner-border spinner-border-sm d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                        </button>
                    </form>

                    <div class="alert mt-4 d-none" id="resultadoAlert" role="alert">
                        <h5 class="alert-heading" id="resultadoTitulo"></h5>
                        <p id="resultadoMensaje" class="mb-0"></p>
                    </div>
                </div>
            </div>

            <div class="card shadow mt-4 mb-5">
                <div class="card-header bg-white">
                    <h4 class="mb-0 text-success">Generar Reporte de Siniestralidad</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted">Ingresa los parámetros para descargar el reporte en formato Excel (.xlsx).</p>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">ID de Flota</label>
                            <input type="number" class="form-control" id="inputFlotaId" placeholder="Ej: 56789123">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Fecha Inicio</label>
                            <input type="date" class="form-control" id="inputFechaInicio">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Fecha Fin</label>
                            <input type="date" class="form-control" id="inputFechaFin">
                        </div>
                    </div>
                    
                    <button class="btn btn-success w-100" onclick="descargarReporteConFiltros()">
                        📊 Descargar Excel Filtrado
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>



<script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Evita que la página se recargue

        const fileInput = document.getElementById('pdfFile');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const alertBox = document.getElementById('resultadoAlert');
        const alertTitle = document.getElementById('resultadoTitulo');
        const alertMsg = document.getElementById('resultadoMensaje');

        // UI: Mostrar modo de carga
        btnSubmit.disabled = true;
        btnText.innerText = " Procesando con IA...";
        btnSpinner.classList.remove('d-none');
        alertBox.classList.add('d-none');

        // Preparar el archivo
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
            // Llamar al endpoint REST que construimos anteriormente
            const response = await fetch('/api/reclamos/procesar-pdf', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                // Éxito: Mostrar mensaje verde
                alertBox.className = "alert mt-4 alert-success";
                alertTitle.innerText = "¡Éxito!";
                alertMsg.innerText = `${data.mensaje}. ID asignado: ${data.reclamo_id}`;
                fileInput.value = ""; // Limpiar input
            } else {
                const errorText = await response.text();
                // Error de negocio: Mostrar mensaje amarillo
                alertBox.className = "alert mt-4 alert-warning";
                alertTitle.innerText = "Aviso del Sistema";
                alertMsg.innerText = errorText;
            }
        } catch (error) {
            // Error de conexión: Mostrar mensaje rojo
            alertBox.className = "alert mt-4 alert-danger";
            alertTitle.innerText = "Error Crítico";
            alertMsg.innerText = "No se pudo conectar con el motor OCR o la Base de Datos.";
        } finally {
            // UI: Restaurar botón
            btnSubmit.disabled = false;
            btnText.innerText = "Procesar Documento";
            btnSpinner.classList.add('d-none');
        }
    });

    // Función para el botón del reporte Excel con Filtros
    function descargarReporteConFiltros() {
        const flotaId = document.getElementById('inputFlotaId').value;
        const inicio = document.getElementById('inputFechaInicio').value;
        const fin = document.getElementById('inputFechaFin').value;

        // Validación para evitar enviar campos vacíos a Spring Boot
        if(!flotaId || !inicio || !fin) {
            alert("Por favor, completa los tres campos (ID Flota, Fecha Inicio y Fecha Fin) antes de generar el reporte.");
            return;
        }

        // Redirección nativa para iniciar la descarga
        window.location.href = `/api/reportes/siniestralidad/filtrado?flotaId=${flotaId}&fechaInicio=${inicio}&fechaFin=${fin}`;
    }
</script>

</body>
</html>
